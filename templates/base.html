<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>{% block title %}Estuda Ai{% endblock %}</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='/static/index.css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>

<body>

    <header>
        <div class="topo">
            <div class="left-topo">
                <img class="logo-topo" src="/static/videos/logosemtexto.png">
                <h1 class="texto-p">Estuda Ai</h1>
            </div>
            <div class="barra-pesquisa">
                <i class="fas fa-search procurar-topo"></i>
                <input class="input-topo" type="text" placeholder="Buscar vídeos educativos...">
            </div>
            <div class="nav-topo">
                <i class="fas fa-bars icon-menu"></i>
            </div>
        </div>
    </header>
    <div class="overlay" id="overlay"></div>

    <div class="menu-lateral" id="menuLateral">
        <span class="fechar-menu" id="fecharMenu">&times;</span>
        <ul class="icons-cards">
            <li class="icons-menu">
                <a class="nome-menu" href="/index">
                    <i class="fa fa-home icons_"></i> Início
                </a>
            </li>
            <li class="icons-menu">
                <a href="/calendario">
                    <i class="fa fa-calendar icons_"></i> Calendário
                </a>
            </li>
            <li class="icons-menu">
                <a href="/salvos">
                    <i class="fa fa-bookmark icons_"></i> Salvos
                </a>
            </li>
            <li class="icons-menu">
                <a href="/perfil">
                    <i class="fa fa-user icons_"></i> Perfil
                </a>
            </li>
            <li class="icons-menu">
                <a href="/logout">
                    <i class="fa fa-chevron-left icons_"></i> Sair
                </a>
            </li>
        </ul>
    </div>


    <main>
        {% block content %}
        <!-- Conteúdo da página -->
        {% endblock %}
    </main>
    <script src='/static/js/filtrovideos.js'></script>
    <script src='/static/js/videoplayer.js'></script>
    <script src='/static/js/menulateral.js'></script>
    {% block extra_scripts %}
    {% endblock %}
</body>

</html>
